services:
  - type: web
    name: medical-stt-live
    runtime: python
    rootDir: Source Code
    buildCommand: pip install -r requirements-demo.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # You will paste this in the Render dashboard
      - key: HF_TOKEN
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true  # Render auto-generates a secure random value
